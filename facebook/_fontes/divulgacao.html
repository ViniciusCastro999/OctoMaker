<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --blue:#3d7bff; --yellow:#ffd000; --text:#eef2f8; --muted:#8d97ab; --line:#2b3140; --mono:"JetBrains Mono",Menlo,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:radial-gradient(80% 60% at 50% 35%, #232834, #0e1015); color:var(--text); font-family:Inter,sans-serif; position:relative; }
body::before { display:none; }
.page { position:relative; height:100%; padding:84px 84px 80px; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; align-items:center; font:700 28px var(--mono); }
.brand { display:flex; align-items:center; gap:14px; color:var(--blue); }
.brand img { width:54px; height:54px; }
.brand b { color:var(--yellow); }
.swipe { color:var(--muted); font:600 24px var(--mono); display:flex; align-items:center; gap:10px; }
.swipe i { color:var(--yellow); font-size:30px; }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font:600 26px var(--mono); color:var(--muted); position:relative; z-index:2; }
.foot .url { color:var(--yellow); display:flex; align-items:center; gap:10px; }
h1 { font:800 88px/1.04 var(--mono); letter-spacing:-.035em; }
h1 .b { color:var(--blue); }
h1 .y { color:var(--yellow); }
.lead { font-size:36px; line-height:1.45; color:#c3cbd9; }
.eyebrow { font:700 28px var(--mono); color:var(--yellow); }
.card { background:#171b23e6; border:2px solid var(--line); border-radius:28px; padding:30px 34px; }
.ico { flex:none; width:64px; height:64px; border-radius:16px; background:#3d7bff1f; border:2px solid #3d7bff55; color:var(--blue); display:grid; place-items:center; font-size:34px; }
.ico.y { background:#ffd0001a; border-color:#ffd00066; color:var(--yellow); }
.trace { position:absolute; left:0; right:0; top:1150px; height:40px; z-index:1; }
</style></head><body><div class="page"><div class="top"><span class="brand"><span>octo<b>maker</b>_</span></span><span style="font:600 24px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center"><i class="ph-fill ph-map-pin" style="color:var(--yellow)"></i>Pouso Alegre, MG</span></div>
<div style="margin-top:70px">
  <div class="eyebrow">// criação de sites</div>
  <h1 style="margin-top:22px;font-size:90px">Seu site pronto em <span class="b">até 7 dias</span></h1>
</div>
<div style="display:flex;align-items:baseline;gap:18px;margin-top:40px">
  <span style="font:600 32px var(--mono);color:var(--muted)">a partir de</span>
  <span style="font:800 110px var(--mono);color:var(--yellow);letter-spacing:-.04em">R$ 300</span>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px"><div class="card" style="display:flex;gap:18px;align-items:center;padding:22px 24px"><span class="ico y"><i class="ph-bold ph-device-mobile"></i></span><b style="font-size:30px;font-weight:600">Funciona no celular</b></div><div class="card" style="display:flex;gap:18px;align-items:center;padding:22px 24px"><span class="ico y"><i class="ph-bold ph-whatsapp-logo"></i></span><b style="font-size:30px;font-weight:600">Botão de WhatsApp</b></div><div class="card" style="display:flex;gap:18px;align-items:center;padding:22px 24px"><span class="ico y"><i class="ph-bold ph-google-logo"></i></span><b style="font-size:30px;font-weight:600">Aparece no Google</b></div><div class="card" style="display:flex;gap:18px;align-items:center;padding:22px 24px"><span class="ico y"><i class="ph-bold ph-globe"></i></span><b style="font-size:30px;font-weight:600">Domínio próprio</b></div></div>
<div style="margin-top:44px;display:flex;align-items:center;gap:22px;background:#25D366;color:#fff;border-radius:26px;padding:26px 32px">
  <i class="ph-fill ph-whatsapp-logo" style="font-size:64px"></i>
  <div><div style="font:600 26px Inter;opacity:.9">Chama no WhatsApp</div><div style="font:800 46px var(--mono)">(35) 98422-0874</div></div>
</div>
<div class="foot"><span>@octomaker_</span><span class="url"><i class="ph-bold ph-globe"></i>octomaker.com.br</span></div></div></body></html>
