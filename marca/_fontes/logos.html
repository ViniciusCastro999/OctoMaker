<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Logos OctoMaker (fonte dos PNGs)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 40px; background: transparent; display: flex; flex-direction: column; align-items: flex-start; gap: 40px; }
  .lock { display: inline-flex; align-items: center; gap: .24em; font: 800 200px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.05em; }
  .lock svg { width: 1.02em; height: 1.02em; flex: none; }
  .lock span { padding: .04em .06em .1em 0; }
  #h-dark { background: #050816; color: #fff; padding: 120px 140px; }
  #h-white { color: #fff; }
  #h-navy { color: #0B1A33; }
</style>
</head>
<body>
  <!-- Rendered to marca/logo/octomaker-horizontal*.png. Symbol: blue tile, white "o", mint "online" dot. -->
  <div class="lock" id="h-dark"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#1F5BFF"/><circle cx="22" cy="26" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="6"/><circle cx="36" cy="12" r="4.5" fill="#3DDC97"/></svg><span>octomaker</span></div>
  <div class="lock" id="h-white"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#1F5BFF"/><circle cx="22" cy="26" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="6"/><circle cx="36" cy="12" r="4.5" fill="#3DDC97"/></svg><span>octomaker</span></div>
  <div class="lock" id="h-navy"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#1F5BFF"/><circle cx="22" cy="26" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="6"/><circle cx="36" cy="12" r="4.5" fill="#3DDC97"/></svg><span>octomaker</span></div>
</body>
</html>
