<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --g900:#0e1015; --g800:#171b23; --line:#2b3140; --blue:#3d7bff; --yellow:#ffd000; --text:#eef2f8; --muted:#8d97ab; --mono:"JetBrains Mono",Menlo,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:radial-gradient(80% 60% at 50% 35%, #232834, #0e1015); color:var(--text); font-family:Inter,sans-serif; position:relative; }
body::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#5a647855 2px, transparent 2px); background-size:40px 40px; }
.traces { position:absolute; inset:0; }
.page { position:relative; height:100%; padding:90px 84px; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; font:600 26px var(--mono); color:var(--muted); }
.top b { color:var(--text); } .top b span { color:var(--yellow); }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font:600 26px var(--mono); color:var(--muted); }
.foot .h { color:var(--yellow); }
h1 { font:800 92px/1.04 var(--mono); letter-spacing:-.035em; }
h1 .b { color:var(--blue); text-shadow:0 0 36px #3d7bffaa; }
h1 .y { color:var(--yellow); text-shadow:0 0 36px #ffd00088; }
.lead { font-size:36px; line-height:1.45; color:#c3cbd9; }
.eyebrow { font:700 28px var(--mono); color:var(--yellow); }
.card { background:#171b23e6; border:2px solid var(--line); border-radius:28px; padding:34px 38px; }
</style></head><body>
<div class="page">
<div class="top"><b>octo<span>maker</span>_</b><span>1/05</span></div>

<div style="margin-top:90px">
  <div class="eyebrow">// olá, somos a OctoMaker</div>
  <h1 style="margin-top:28px">Seu negócio merece um <span class="b">site</span> profissional<span class="y">_</span></h1>
  <p class="lead" style="margin-top:36px;max-width:820px">Sites para nutricionistas, psicólogos, consultórios e pequenas lojas.</p>
</div>
<img src="../../marca/logo/octomaker-simbolo.png" style="width:440px;margin:30px -30px 0 auto">

<div class="foot"><span class="h">@octomaker.dev</span><span>sites para pequenas empresas</span></div>
</div></body></html>
