<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --g900:#0e1015; --g800:#171b23; --line:#2b3140; --blue:#3d7bff; --yellow:#ffd000; --text:#eef2f8; --muted:#8d97ab; --mono:"JetBrains Mono",Menlo,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:radial-gradient(80% 60% at 50% 35%, #232834, #0e1015); color:var(--text); font-family:Inter,sans-serif; position:relative; }
body::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#5a647855 2px, transparent 2px); background-size:40px 40px; }
.traces { position:absolute; inset:0; }
.page { position:relative; height:100%; padding:90px 84px; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; font:600 26px var(--mono); color:var(--muted); }
.top b { color:var(--text); } .top b span { color:var(--yellow); }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font:600 26px var(--mono); color:var(--muted); }
.foot .h { color:var(--yellow); }
h1 { font:800 92px/1.04 var(--mono); letter-spacing:-.035em; }
h1 .b { color:var(--blue); text-shadow:0 0 36px #3d7bffaa; }
h1 .y { color:var(--yellow); text-shadow:0 0 36px #ffd00088; }
.lead { font-size:36px; line-height:1.45; color:#c3cbd9; }
.eyebrow { font:700 28px var(--mono); color:var(--yellow); }
.card { background:#171b23e6; border:2px solid var(--line); border-radius:28px; padding:34px 38px; }
</style></head><body>
<div class="page">
<div class="top"><b>octo<span>maker</span>_</b><span>3/05</span></div>

<div style="margin-top:70px">
  <div class="eyebrow">// portfólio</div>
  <h1 style="margin-top:24px;font-size:80px">Site para <span class="b">nutricionista</span></h1>
</div>
<div style="margin-top:44px;position:relative">
  <div style="border:2px solid var(--line);border-radius:26px;overflow:hidden;background:#0e1015;box-shadow:0 30px 80px #0009">
    <div style="height:44px;display:flex;gap:10px;align-items:center;padding:0 18px;border-bottom:2px solid var(--line)"><i style="width:14px;height:14px;border-radius:50%;background:#ff5f57"></i><i style="width:14px;height:14px;border-radius:50%;background:#febc2e"></i><i style="width:14px;height:14px;border-radius:50%;background:#28c840"></i></div>
    <img src="../../portfolio/thumbs/nutricionista.jpg" style="width:100%;height:500px;object-fit:cover;object-position:top;display:block">
  </div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:40px;font:600 26px var(--mono)">
  <span class="card" style="padding:12px 22px;border-radius:999px"><i class="ph-bold ph-currency-circle-dollar" style="color:var(--yellow)"></i> Planos e preços</span>
  <span class="card" style="padding:12px 22px;border-radius:999px"><i class="ph-bold ph-whatsapp-logo" style="color:var(--yellow)"></i> Agendar pelo WhatsApp</span>
  <span class="card" style="padding:12px 22px;border-radius:999px"><i class="ph-bold ph-chat-circle-text" style="color:var(--yellow)"></i> Depoimentos</span>
  <span class="card" style="padding:12px 22px;border-radius:999px"><i class="ph-bold ph-question" style="color:var(--yellow)"></i> Dúvidas frequentes</span>
</div>

<div class="foot"><span class="h">@octomaker_</span><span>link na bio</span></div>
</div></body></html>
