<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --blue:#3d7bff; --yellow:#ffd000; --text:#eef2f8; --muted:#8d97ab; --line:#2b3140; --mono:"JetBrains Mono",Menlo,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:radial-gradient(80% 60% at 50% 35%, #232834, #0e1015); color:var(--text); font-family:Inter,sans-serif; position:relative; }
body::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#5a647855 2px, transparent 2px); background-size:40px 40px; }
.page { position:relative; height:100%; padding:84px 84px 80px; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; align-items:center; font:700 28px var(--mono); }
.brand { display:flex; align-items:center; gap:14px; color:var(--blue); }
.brand img { width:54px; height:54px; }
.brand b { color:var(--yellow); }
.swipe { color:var(--muted); font:600 24px var(--mono); display:flex; align-items:center; gap:10px; }
.swipe i { color:var(--yellow); font-size:30px; }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font:600 26px var(--mono); color:var(--muted); position:relative; z-index:2; }
.foot .url { color:var(--yellow); display:flex; align-items:center; gap:10px; text-shadow:0 0 18px #ffd00055; }
h1 { font:800 88px/1.04 var(--mono); letter-spacing:-.035em; }
h1 .b { color:var(--blue); text-shadow:0 0 36px #3d7bffaa; }
h1 .y { color:var(--yellow); text-shadow:0 0 36px #ffd00088; }
.lead { font-size:36px; line-height:1.45; color:#c3cbd9; }
.eyebrow { font:700 28px var(--mono); color:var(--yellow); }
.card { background:#171b23e6; border:2px solid var(--line); border-radius:28px; padding:30px 34px; }
.ico { flex:none; width:64px; height:64px; border-radius:16px; background:#3d7bff1f; border:2px solid #3d7bff55; color:var(--blue); display:grid; place-items:center; font-size:34px; }
.ico.y { background:#ffd0001a; border-color:#ffd00066; color:var(--yellow); }
.trace { position:absolute; left:0; right:0; top:1150px; height:40px; z-index:1; }
</style></head><body><div class="page"><div class="top"><span class="brand"><img src="../../marca/logo/octomaker-moeda-frente.png" alt="">octo<b>maker</b>_</span></div>
<div style="margin-top:90px">
  <div class="eyebrow">// para quem</div>
  <h1 style="margin-top:24px">Feito para o <span class="b">seu</span> negócio</h1>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:50px"><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-leaf"></i></span><b style="font-size:32px;font-weight:600">Nutricionistas</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-brain"></i></span><b style="font-size:32px;font-weight:600">Psicólogos</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-storefront"></i></span><b style="font-size:32px;font-weight:600">Lojas</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-scissors"></i></span><b style="font-size:32px;font-weight:600">Barbearias</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-camera"></i></span><b style="font-size:32px;font-weight:600">Fotógrafos</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-sparkle"></i></span><b style="font-size:32px;font-weight:600">Estúdios de beleza</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-drop"></i></span><b style="font-size:32px;font-weight:600">Tatuadores</b></div><div class="card" style="display:flex;gap:20px;align-items:center;padding:24px 26px"><span class="ico y"><i class="ph-bold ph-books"></i></span><b style="font-size:32px;font-weight:600">Sebos e livrarias</b></div></div>
<p class="lead" style="margin-top:26px;font-size:30px;color:var(--muted)">E qualquer negócio que atende pelo WhatsApp.</p>
