<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root { --blue:#3d7bff; --yellow:#ffd000; --text:#eef2f8; --muted:#8d97ab; --line:#2b3140; --mono:"JetBrains Mono",Menlo,monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body { background:radial-gradient(80% 60% at 50% 35%, #232834, #0e1015); color:var(--text); font-family:Inter,sans-serif; position:relative; }
body::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#5a647855 2px, transparent 2px); background-size:40px 40px; }
.page { position:relative; height:100%; padding:84px 84px 80px; display:flex; flex-direction:column; }
.top { display:flex; justify-content:space-between; align-items:center; font:700 28px var(--mono); }
.brand { display:flex; align-items:center; gap:14px; color:var(--blue); }
.brand img { width:54px; height:54px; }
.brand b { color:var(--yellow); }
.swipe { color:var(--muted); font:600 24px var(--mono); display:flex; align-items:center; gap:10px; }
.swipe i { color:var(--yellow); font-size:30px; }
.foot { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font:600 26px var(--mono); color:var(--muted); position:relative; z-index:2; }
.foot .url { color:var(--yellow); display:flex; align-items:center; gap:10px; text-shadow:0 0 18px #ffd00055; }
h1 { font:800 88px/1.04 var(--mono); letter-spacing:-.035em; }
h1 .b { color:var(--blue); text-shadow:0 0 36px #3d7bffaa; }
h1 .y { color:var(--yellow); text-shadow:0 0 36px #ffd00088; }
.lead { font-size:36px; line-height:1.45; color:#c3cbd9; }
.eyebrow { font:700 28px var(--mono); color:var(--yellow); }
.card { background:#171b23e6; border:2px solid var(--line); border-radius:28px; padding:30px 34px; }
.ico { flex:none; width:64px; height:64px; border-radius:16px; background:#3d7bff1f; border:2px solid #3d7bff55; color:var(--blue); display:grid; place-items:center; font-size:34px; }
.ico.y { background:#ffd0001a; border-color:#ffd00066; color:var(--yellow); }
.trace { position:absolute; left:0; right:0; top:1150px; height:40px; z-index:1; }
</style></head><body><div class="page"><div class="top"><span class="brand"><img src="../../marca/logo/octomaker-moeda-frente.png" alt="">octo<b>maker</b>_</span></div>
<div style="margin-top:90px">
  <div class="eyebrow">// passo a passo</div>
  <h1 style="margin-top:24px">Como <span class="b">funciona</span></h1>
</div>
<div style="position:relative;margin-top:56px;display:flex;flex-direction:column;gap:44px">
  <div style="position:absolute;left:36px;top:40px;bottom:50px;width:5px;background:linear-gradient(var(--yellow),var(--blue));box-shadow:0 0 20px #ffd00066"></div><div style="display:flex;gap:36px;position:relative">
  <div style="flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--yellow);display:grid;place-items:center;font:800 32px var(--mono);color:var(--yellow);background:#0e1015;box-shadow:0 0 30px #ffd00066;z-index:1">1</div>
  <div style="padding-top:4px"><b style="font:800 42px var(--mono)">Conversa</b><p class="lead" style="font-size:30px;margin-top:4px">Você conta sobre o seu negócio pelo WhatsApp.</p></div></div><div style="display:flex;gap:36px;position:relative">
  <div style="flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--yellow);display:grid;place-items:center;font:800 32px var(--mono);color:var(--yellow);background:#0e1015;box-shadow:0 0 30px #ffd00066;z-index:1">2</div>
  <div style="padding-top:4px"><b style="font:800 42px var(--mono)">Proposta</b><p class="lead" style="font-size:30px;margin-top:4px">Enviamos preço e prazo, sem surpresas.</p></div></div><div style="display:flex;gap:36px;position:relative">
  <div style="flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--yellow);display:grid;place-items:center;font:800 32px var(--mono);color:var(--yellow);background:#0e1015;box-shadow:0 0 30px #ffd00066;z-index:1">3</div>
  <div style="padding-top:4px"><b style="font:800 42px var(--mono)">Criação</b><p class="lead" style="font-size:30px;margin-top:4px">Montamos o site e você aprova cada parte.</p></div></div><div style="display:flex;gap:36px;position:relative">
  <div style="flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--yellow);display:grid;place-items:center;font:800 32px var(--mono);color:var(--yellow);background:#0e1015;box-shadow:0 0 30px #ffd00066;z-index:1">4</div>
  <div style="padding-top:4px"><b style="font:800 42px var(--mono)">No ar</b><p class="lead" style="font-size:30px;margin-top:4px">Site publicado com seu domínio.</p></div></div>
</div>
