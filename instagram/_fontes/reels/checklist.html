<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css"><style>
.list { display:flex; flex-direction:column; gap:22px; }
.row { display:flex; gap:30px; align-items:center; padding:28px 34px; font-size:44px; font-weight:600; }
.box { flex:none; width:70px; height:70px; border-radius:18px; border:4px solid #3a4152; display:grid; place-items:center; position:relative; }
.box i { position:absolute; inset:-4px; border-radius:18px; background:var(--yellow); color:#111; display:grid; place-items:center; font-size:46px; box-shadow:0 0 30px #ffd00088; }
</style></head><body><div class="brand">octo<b>maker</b>_</div>
<section class="scene" style="--s:0s;--e:7.8s">
  <h1 class="in" style="--d:.1s">Seu site tem <span class="b">tudo isso?</span></h1>
  <div class="list">
    <div class="row card in" style="--d:.6s"><span class="box"><i class="ph-bold ph-check pop" style="--d:1.8s"></i></span>Funciona bem no celular</div>
    <div class="row card in" style="--d:.75s"><span class="box"><i class="ph-bold ph-check pop" style="--d:2.6s"></i></span>Botão de WhatsApp visível</div>
    <div class="row card in" style="--d:.9s"><span class="box"><i class="ph-bold ph-check pop" style="--d:3.4s"></i></span>Aparece no Google</div>
    <div class="row card in" style="--d:1.05s"><span class="box"><i class="ph-bold ph-check pop" style="--d:4.2s"></i></span>Carrega rápido</div>
    <div class="row card in" style="--d:1.2s"><span class="box"><i class="ph-bold ph-check pop" style="--d:5s"></i></span>Preços ou serviços claros</div>
    <div class="row card in" style="--d:1.35s"><span class="box"><i class="ph-bold ph-check pop" style="--d:5.8s"></i></span>Endereço e horário</div>
  </div>
</section>
<section class="scene last" style="--s:7.8s"><div class="glow"></div>
  <h1 class="in" style="--d:7.9s">Faltou algum <span class="y">item</span>?</h1>
  <p class="sub in" style="--d:8.3s">A gente resolve para você.</p>
  <p class="url pop" style="--d:8.7s">octomaker.com.br</p>
</section></body></html>
