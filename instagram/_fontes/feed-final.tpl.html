const UN = id => `https://images.unsplash.com/${id}?w=1080&h=1350&fit=crop&q=85`;
const PH = { desk: 'photo-1618826908215-bf5c44ca24af', table: 'photo-1565630916779-e303be97b6f5', hand: 'photo-1601972599720-36938d4ecd31', note: 'photo-1621606453029-5656bd7fa6c1', dark: 'photo-1582133456304-2f5cb1c2afbb', man: 'photo-1661870139279-95fecab7c53a' };
const CHECK = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHAT = (name, msgs, typing) => `<div class="chat"><div class="hd"><i></i><span>${name}<small>online</small></span></div><div class="ms">${msgs.map(([m, h, me]) => `<div${me ? ' class="me"' : ''}>${m}<small>${h}</small></div>`).join('')}</div>${typing ? `<div class="typ">${typing}<b>➤</b></div>` : ''}</div>`;
const SYM = (c, e) => `<svg class="sym" viewBox="0 0 40 40"><path d="M7 22A13 13 0 0 1 33 22V24H7Z" fill="${c}"/><circle cx="15" cy="17" r="2.4" fill="${e}"/><circle cx="25" cy="17" r="2.4" fill="${e}"/><g fill="none" stroke="${c}" stroke-width="3.6" stroke-linecap="round"><path d="M10 27Q10 35 5 35"/><path d="M17 27V36"/><path d="M23 27V36"/><path d="M30 27Q30 35 35 35"/></g></svg>`;
// elemento que sobe da borda de baixo para preencher o slide
const PEEK = k => {

POSTS.forEach(p => p.hl ? p.hl.forEach(([name, icon, bg]) => { const sec = document.createElement('section'); sec.className = 'hl'; sec.dataset.out = `${p.folder}/${name}.png`; sec.innerHTML = `<div class="ring" style="background:${bg}">${icon}</div>`; feed.appendChild(sec); }) : p.slides.forEach((s, i) => {
  const sec = document.createElement('section');
  const bg = s.bg || 'navy';
  sec.className = bg === 'light' ? 'cream' : bg;
  if (bg === 'light') sec.style.background = 'var(--paper)';
  sec.dataset.out = `${p.folder}/${p.slides.length > 1 ? `slide-${i + 1}` : 'post'}.png`;
  sec.innerHTML = symFor(bg) + (p.slides.length > 1 ? `<span class="cnt">${i + 1}/${p.slides.length}</span>` : '') + T[s.type](s) + (s.peek ? PEEK(s.peek) : '');
  feed.appendChild(sec);
}));
// encaixa a tela em perspectiva (homografia retângulo -> quadrilátero)
function quad(el) {
  const w = el.offsetWidth, h = el.offsetHeight, [p0, p1, p2, p3] = el.dataset.quad.split(' ').map(p => p.split(',').map(Number));
  const sx = p0[0] - p1[0] + p2[0] - p3[0], sy = p0[1] - p1[1] + p2[1] - p3[1];
  const dx1 = p1[0] - p2[0], dx2 = p3[0] - p2[0], dy1 = p1[1] - p2[1], dy2 = p3[1] - p2[1], den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, hh = (dx1 * sy - sx * dy1) / den;
  const a = p1[0] - p0[0] + g * p1[0], b = p3[0] - p0[0] + hh * p3[0], d = p1[1] - p0[1] + g * p1[1], e = p3[1] - p0[1] + hh * p3[1];
  el.style.transform = `matrix3d(${a / w},${d / w},0,${g / w}, ${b / h},${e / h},0,${hh / h}, 0,0,1,0, ${p0[0]},${p0[1]},0,1)`;
}
document.querySelectorAll('[data-quad]').forEach(quad);
document.querySelectorAll('svg.octo').forEach(s => { const c = { ...OCTOS[s.dataset.octo] }; if (s.dataset.labels) c.labels = s.dataset.labels.split(','); octopus(s, c); });
